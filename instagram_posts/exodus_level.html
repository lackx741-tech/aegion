<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exodus Level Reel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: #000000; /* Pitch black for premium look */
      color: white;
      font-family: 'Inter', sans-serif;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Brand Glow - Very subtle and elegant */
    .glow {
      position: absolute;
      width: 1200px;
      height: 1200px;
      background: radial-gradient(circle, rgba(100,50,255,0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: breathe 8s infinite ease-in-out alternate;
    }
    
    .glow2 {
      position: absolute;
      width: 1000px;
      height: 1000px;
      background: radial-gradient(circle, rgba(0,229,255,0.1) 0%, rgba(0,0,0,0) 70%);
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: breathe2 10s infinite ease-in-out alternate;
    }

    @keyframes breathe {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
    @keyframes breathe2 {
      0% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
    }

    .logo {
      position: absolute;
      top: 150px;
      width: 400px;
      z-index: 10;
      opacity: 0.9;
    }

    /* 3D Scene for the Card */
    .scene {
      width: 1080px;
      height: 1000px;
      perspective: 1500px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      margin-top: 100px;
    }

    .card-container {
      position: relative;
      width: 800px;
      transform-style: preserve-3d;
      animation: elegantFloat 10s infinite linear;
    }

    .card-img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 40px 60px rgba(0,0,0,0.9)) drop-shadow(0 0 40px rgba(100,50,255,0.3));
    }

    /* Light sweep effect over the card */
    .card-container::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 60%, rgba(255,255,255,0) 100%);
      background-size: 300% 300%;
      z-index: 20;
      mix-blend-mode: overlay;
      animation: lightSweep 10s infinite linear;
      border-radius: 40px; /* roughly matching card corners */
    }

    @keyframes lightSweep {
      0% { background-position: 100% 100%; }
      20% { background-position: 0% 0%; }
      100% { background-position: 0% 0%; }
    }

    @keyframes elegantFloat {
      0% { transform: rotateY(15deg) rotateX(10deg) translateY(0px); filter: drop-shadow(0 40px 60px rgba(0,0,0,0.9)); }
      25% { transform: rotateY(0deg) rotateX(5deg) translateY(-20px); filter: drop-shadow(0 60px 80px rgba(0,0,0,0.7)); }
      50% { transform: rotateY(-15deg) rotateX(10deg) translateY(0px); filter: drop-shadow(0 40px 60px rgba(0,0,0,0.9)); }
      75% { transform: rotateY(0deg) rotateX(15deg) translateY(20px); filter: drop-shadow(0 20px 40px rgba(0,0,0,1)); }
      100% { transform: rotateY(15deg) rotateX(10deg) translateY(0px); filter: drop-shadow(0 40px 60px rgba(0,0,0,0.9)); }
    }

    /* Minimalist Typography */
    .text-container {
      position: absolute;
      bottom: 250px;
      width: 1080px;
      text-align: center;
      z-index: 20;
      height: 200px;
    }

    .message {
      position: absolute;
      width: 100%;
      font-size: 80px;
      font-weight: 300;
      letter-spacing: 4px;
      opacity: 0;
      text-transform: uppercase;
    }

    .message strong {
      font-weight: 900;
      background: -webkit-linear-gradient(45deg, #ffffff, #a8a8a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Msg 1 */
    .msg1 {
      animation: textSequence 10s infinite;
      animation-delay: 0s;
    }
    
    /* Msg 2 */
    .msg2 {
      animation: textSequence 10s infinite;
      animation-delay: 3.33s;
    }

    /* Msg 3 */
    .msg3 {
      animation: textSequence 10s infinite;
      animation-delay: 6.66s;
      background: -webkit-linear-gradient(45deg, #00E5FF, #8A2BE2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 2px;
      filter: drop-shadow(0 0 30px rgba(138,43,226,0.5));
    }

    /* Fade in for 1s, hold for 1.33s, fade out for 1s. Total 3.33s out of 10s (33.3%) */
    @keyframes textSequence {
      0% { opacity: 0; transform: translateY(20px); filter: blur(10px); }
      10% { opacity: 1; transform: translateY(0); filter: blur(0px); }
      23% { opacity: 1; transform: translateY(0); filter: blur(0px); }
      33% { opacity: 0; transform: translateY(-20px); filter: blur(10px); }
      100% { opacity: 0; }
    }

  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  
  <img src="../clones/exodus-card-site/logo-wordmark.svg" class="logo">
  
  <div class="scene">
    <div class="card-container">
      <img src="../clones/exodus-card-site/card.png" class="card-img">
    </div>
  </div>

  <div class="text-container">
    <div class="message msg1">Limitless <strong>Spending</strong>.</div>
    <div class="message msg2">Zero <strong>Hassle</strong>.</div>
    <div class="message msg3">The Exodus Card.</div>
  </div>
</body>
</html>
